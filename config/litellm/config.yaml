model_list:
  - model_name: llama3.1:8b
    litellm_params:
      model: ollama/llama3.1:8b
      api_base: http://ollama:11434

  - model_name: llama3.2:3b
    litellm_params:
      model: ollama/llama3.2:3b
      api_base: http://ollama:11434

  - model_name: nomic-embed-text
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://ollama:11434

  - model_name: whisper-1
    litellm_params:
      model: openai/Systran/faster-whisper-small
      api_base: http://whisper-stt:8000/v1
      api_key: sk-local-stt

  - model_name: tts-1
    litellm_params:
      model: openai/tts-1
      api_base: http://openedai-tts:8000/v1
      api_key: sk-local-tts

litellm_settings:
  drop_params: true
  cache: true
  callbacks: ["arize_phoenix"]
  cache_params:
    type: redis
    host: redis
    port: 6379
