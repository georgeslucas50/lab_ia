<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b1020">
    <meta name="description" content="Ambiente de aprendizagem e ferramentas de inteligência artificial da Escola de Comunicações - Seção Delta.">
    <title>Escola de Comunicações - Seção Delta | Laboratório de IA</title>
    <link rel="stylesheet" href="/static/css/welcome.css">
</head>
<body>
    <div class="ambient ambient--violet" aria-hidden="true"></div>
    <div class="ambient ambient--mint" aria-hidden="true"></div>
    <div class="grid-overlay" aria-hidden="true"></div>

    <main class="page-shell">
        <header class="topbar" aria-label="Identificação do ambiente">
            <a class="brand" href="/" aria-label="Página inicial da Escola de Comunicações - Seção Delta">
                <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
                <span class="brand-copy">
                    <strong>EsCom</strong>
                    <span>SEÇÃO DELTA</span>
                </span>
            </a>
            <span class="system-status"><span class="status-dot"></span> AMBIENTE DE APRENDIZAGEM</span>
        </header>

        <section class="hero" aria-labelledby="page-title">
            <div class="hero-copy">
                <p class="eyebrow"><span class="eyebrow-line"></span> INTELIGÊNCIA ARTIFICIAL · FORMAÇÃO</p>
                <h1 id="page-title">Escola de Comunicações <span>- Seção Delta</span></h1>
            </div>

            <div class="destination-grid" aria-label="Áreas disponíveis">
                <a class="destination-card destination-card--lab" href="/dashboard">
                    <div class="card-topline">
                        <span class="card-icon card-icon--lab" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none"><path d="M9 3h6M10 3v6.2l-5.1 8.1A2.4 2.4 0 0 0 7 21h10a2.4 2.4 0 0 0 2.1-3.7L14 9.2V3M8 15h8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.1 17.2h5.8" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
                        </span>
                        <span class="card-index">01 / 02</span>
                    </div>
                    <div class="card-copy">
                        <p class="card-kicker">ACESSO AO AMBIENTE</p>
                        <h2>Laboratório</h2>
                        <p>Nosso dashboard com todas as ferramentas.</p>
                    </div>
                    <span class="card-action">Explorar ferramentas <span aria-hidden="true">↗</span></span>
                    <span class="card-orbit" aria-hidden="true"></span>
                </a>

                <button class="destination-card destination-card--classroom" type="button" disabled aria-labelledby="classroom-title">
                    <div class="card-topline">
                        <span class="card-icon card-icon--classroom" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v15H6.5A2.5 2.5 0 0 0 4 20.5v-15Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M4 20.5A2.5 2.5 0 0 1 6.5 18H20M8 7h8M8 10.5h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
                        </span>
                        <span class="status-badge" id="classroom-status"><span class="status-dot status-dot--muted"></span> EM CONSTRUÇÃO</span>
                    </div>
                    <div class="card-copy">
                        <p class="card-kicker">CONTEÚDO E ATIVIDADES</p>
                        <h2 id="classroom-title">Sala de Aula</h2>
                        <p>Um novo espaço de aprendizagem está sendo preparado.</p>
                    </div>
                    <span class="card-action card-action--muted">Sala de Aula: (Em Construção)</span>
                </button>
            </div>

            <footer class="page-footer">
                <span>Escola de Comunicações <span class="footer-separator">/</span> Seção Delta</span>
                <span class="footer-caption">PLATAFORMA LOCAL DE ENSINO <span class="footer-spark">✳</span></span>
            </footer>
        </section>
    </main>
</body>
</html>
